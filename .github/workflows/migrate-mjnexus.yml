name: Migrate MJNexus to F1uway

on:
  push:
    branches: [ "Hyp", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone MJNexus and Run Migration
        env:
          GH_TOKEN: ${{ github.token }}
          B64: ""
        run: |
          gh repo clone MOSiHiHi/MJNexus /tmp/MJNexus -- --depth 1 -b Hyp || gh repo clone MOSiHiHi/MJNexus /tmp/MJNexus -- --depth 1
          mkdir -p scripts
          python3 -c 'import os,zlib,base64; open("scripts/migrate_mjnexus_to_f1uway.py","wb").write(zlib.decompress(base64.b64decode(os.environ["B64"])))'
          python3 scripts/migrate_mjnexus_to_f1uway.py
          git config user.name "F1uway Bot"
          git config user.email "MOSiHiHi@users.noreply.github.com"
          git add scripts/migrate_mjnexus_to_f1uway.py notebook/ learning/ MIGRATION_REPORT.md
          git commit -m "feat(migration): migrate MJNexus kg.sqlite & 17 learning domains to F1uway" || true
          git push
