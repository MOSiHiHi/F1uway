[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1uway"
version = "1.0.0"
description = "F1uway — The Co-Evolutionary Build-to-Learn & Learn-to-Build Meta-Framework"
readme = "README.md"
license = { text = "Unlicense OR MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=1.10",
]

[project.optional-dependencies]
persian = ["hazm==0.12.1"]
ingestion = ["docling-core", "pypdfium2", "trafilatura", "tree-sitter", "duckdb"]
gpu = ["torch>=2.2.0", "FlagEmbedding>=1.2.0"]
server = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "asyncpg>=0.29.0", "langgraph>=0.2.0"]
